[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qie-studio-backend"
version = "1.0.0"
description = "QIE Studio backend — Qwen-Image generation + editing studio (FastAPI)"
requires-python = ">=3.13"
readme = "../README.md"
license = { text = "Apache-2.0" }

# Core web/runtime/persistence dependencies. The heavy inference stack (torch,
# diffusers, nunchaku, ...) lives in the [inference] extra so the API/unit-test layer
# can be installed and tested without a multi-GB CUDA download. The CUDA Docker image
# installs both core + inference (with the CUDA wheel index).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlmodel>=0.0.22",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.18",
    "Pillow>=11.0",
    "pillow-heif>=0.21",
    "httpx>=0.28",
    "huggingface-hub>=0.27",
    "cryptography>=44.0",
    "websockets>=14.1",
]

[project.optional-dependencies]
# Heavy GPU inference stack — installed in the CUDA Docker image. torch is installed
# separately in the Dockerfile against the CUDA wheel index; listed here loosely so a
# host/dev install can pull a CPU build if desired.
inference = [
    "torch>=2.5",
    "diffusers>=0.32",
    "transformers>=4.47",
    "accelerate>=1.2",
    "peft>=0.14",
    "safetensors>=0.4.5",
    "optimum-quanto>=0.2.6",
    "torchao>=0.7",
    "rembg[gpu]>=2.0.59",
    "onnxruntime-gpu>=1.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "httpx>=0.28",
    "types-Pillow",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]
# Alembic migration scripts are autogenerated — don't lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/File) in defaults by design

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "gpu: integration tests that require a real CUDA GPU and downloaded model weights",
    "db: tests that require a live PostgreSQL database (set QIE_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]
